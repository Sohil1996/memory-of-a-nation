name: live-screenshots
on:
  push:
    branches: [screenshots]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .shots/live.py
        continue-on-error: true
      - run: |
          git config user.name shots-bot && git config user.email shots@users.noreply.github.com
          git add -f out && git commit -m "shots [skip ci]" && git push
